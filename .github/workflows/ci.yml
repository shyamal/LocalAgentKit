name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    # SDK 27 declarations require Xcode 27; macOS 27 executes the custom-model fixtures.
    # https://github.com/actions/runner-images/blob/main/images/macos/xcode-27-arm64-Readme.md
    runs-on: xcode-27
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify CI host and toolchain
        run: python3 Scripts/check-ci-toolchain.py

      - name: Build (all targets, strict concurrency)
        # Swift 6 language mode (implied by swift-tools-version 6.2, applied
        # to every target with no per-target override) makes complete
        # concurrency checking mandatory — there is no separate flag to pass
        # here. A concurrency violation is a build error, not a warning.
        run: swift build

      - name: Layering check
        # Fails if LocalAgentKitCore/LocalAgentKitRuntime import an Apple
        # framework. Runs before the test suite: a layering violation is a
        # cheaper, more specific failure to see than a downstream test error.
        run: ./Scripts/check-layering.sh

      - name: Eval suite consistency
        # Structural check of the bundled eval suites against their tool catalog (unknown
        # tools/arguments, bad datetimes, enum violations, confirmation vs.
        # permission tier). Does not run a model — the suites are data the
        # Phase 0 spike and later LocalAgentKitEval (FR-029) both consume.
        run: swift Scripts/validate-eval-suites.swift Sources/LocalAgentKitEval/Suites/phase0

      - name: Format lint
        run: xcrun swift-format lint --configuration .swift-format --recursive --strict Sources Tests Package.swift

      - name: Test + coverage gate (Core + Runtime, 80%)
        # Runs the full suite (must pass with no device and no network) and
        # then enforces metric M4 on LocalAgentKitCore/LocalAgentKitRuntime
        # only, combining coverage across the toolchain's test bundles.
        run: ./Scripts/check-coverage.sh

      - name: Default suite without socket networking or model assets
        run: bash Scripts/check-offline-tests.sh

      - name: Python automation and documentation/toolchain checks (no model, no network)
        run: python3 -m unittest discover -s Scripts/tests -p 'test_*.py'

      - name: Evaluation CLI and orchestration smoke (synthetic, no model)
        env:
          LLVM_PROFILE_FILE: ${{ runner.temp }}/eval-smoke-%p.profraw
        run: |
          swift run --skip-build LocalAgentKitEval run --model mock --limit 1 --output "$RUNNER_TEMP/eval-smoke.json"
          eval_cli="$(swift build --show-bin-path)/LocalAgentKitEval"
          python3 Scripts/eval_ci.py run --cli "$eval_cli" --output "$RUNNER_TEMP/eval-ci-smoke" --smoke
          python3 Scripts/eval_ci.py run --cli "$eval_cli" --output "$RUNNER_TEMP/eval-ci-compare-smoke" --baseline "$RUNNER_TEMP/eval-ci-smoke" --smoke
