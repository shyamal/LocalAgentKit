name: PlanningProbe
options:
  deploymentTarget:
    iOS: "26.4"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    GENERATE_INFOPLIST_FILE: YES
    CODE_SIGN_STYLE: Automatic
packages:
  LocalAgentKit:
    path: ../..
targets:
  PlanningProbe:
    type: application
    platform: iOS
    sources:
      - App
      - path: ../../Sources/LocalAgentKitEval
        excludes: [Suites]
      - path: ../../Sources/LocalAgentKitEval/Suites
        type: folder
        buildPhase: resources
    dependencies:
      - package: LocalAgentKit
        product: LocalAgentKitCore
      - package: LocalAgentKit
        product: LocalAgentKitRuntime
      - package: LocalAgentKit
        product: LocalAgentKitTools
      - package: LocalAgentKit
        product: LocalAgentKitProviders
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.localagentkit.planningprobe
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
schemes:
  PlanningProbe:
    build:
      targets:
        PlanningProbe: all
