# The MVP demo app (PRD §13, TASKS.md M1-UI-03..08). Generated by XcodeGen; the generated
# .xcodeproj is committed so opening it only needs Xcode. Run `xcodegen generate` after editing
# this file.
name: LocalAgentDemo
options:
  bundleIdPrefix: dev.localagentkit.demo
  deploymentTarget:
    iOS: "26.4"
    macOS: "26.4"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    GENERATE_INFOPLIST_FILE: YES
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    # DEVELOPMENT_TEAM is deliberately unset, as in Spike/project.yml — pass it on the
    # xcodebuild command line for a device build.
packages:
  LocalAgentKit:
    path: ../..
targets:
  LocalAgentDemo:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - LocalAgentDemo
    dependencies:
      - package: LocalAgentKit
        product: LocalAgentKitCore
      - package: LocalAgentKit
        product: LocalAgentKitRuntime
      - package: LocalAgentKit
        product: LocalAgentKitProviders
      - package: LocalAgentKit
        product: LocalAgentKitTools
      - package: LocalAgentKit
        product: LocalAgentKitSwiftUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.localagentkit.demo.app
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        ENABLE_HARDENED_RUNTIME: NO
        # EventKit (M1-TL-04/05): both the modern (iOS 17/macOS 14+) and legacy usage-description
        # keys are set, since which one the OS reads for a 26.4 floor isn't documented in the SDK
        # headers (findings-free limitation — verified by building, not by reading docs).
        INFOPLIST_KEY_NSCalendarsFullAccessUsageDescription: "LocalAgent reads your calendar so it can tell you about upcoming meetings."
        INFOPLIST_KEY_NSCalendarsUsageDescription: "LocalAgent reads your calendar so it can tell you about upcoming meetings."
        INFOPLIST_KEY_NSRemindersFullAccessUsageDescription: "LocalAgent creates reminders when you ask it to."
        INFOPLIST_KEY_NSRemindersUsageDescription: "LocalAgent creates reminders when you ask it to."

  # M1-UI-08: proves a UIKit consumer gets full functionality — AgentRuntime, tools, providers —
  # without linking LocalAgentKitSwiftUI. Deliberately minimal: one view controller, no chat UI.
  LocalAgentDemoUIKitCheck:
    type: application
    platform: iOS
    sources:
      - LocalAgentDemoUIKitCheck
    dependencies:
      - package: LocalAgentKit
        product: LocalAgentKitCore
      - package: LocalAgentKit
        product: LocalAgentKitRuntime
      - package: LocalAgentKit
        product: LocalAgentKitTesting
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.localagentkit.demo.uikitcheck
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        ENABLE_HARDENED_RUNTIME: NO
schemes:
  LocalAgentDemo:
    build:
      targets:
        LocalAgentDemo: all
    run:
      config: Debug
  LocalAgentDemoUIKitCheck:
    build:
      targets:
        LocalAgentDemoUIKitCheck: all
    run:
      config: Debug
